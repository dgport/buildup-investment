name: buildup-dev

# Development stack: Postgres + API (hot reload). Run the Next.js frontend on
# the host with `npm run dev` (frontend/.env.development points at :3000).
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Postgres is published on host port 5434 (5432 is often taken by a local
# PostgreSQL install). Inside the compose network the API uses postgres:5432.

services:
  postgres:
    image: postgres:15-alpine
    container_name: buildup_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildup
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildup"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: buildup_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides the localhost URL from backend/.env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/buildup?schema=public
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/public/uploads
      # un-watermarked originals of listing/project photos (never served)
      - originals_data:/app/storage/originals
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed; npm run start:dev"

volumes:
  postgres_data:
  uploads_data:
  originals_data:
