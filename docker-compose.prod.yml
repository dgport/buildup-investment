name: buildup-prod

# Production stack: Postgres + API + Next.js frontend.
#
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
#
# backend/.env must contain the production secrets (JWT, Google, Resend,
# FRONTEND_URL=https://buildup.ge). DATABASE_URL is injected below.
# frontend/.env.production must point NEXT_PUBLIC_API_* at https://api.buildup.ge.

services:
  postgres:
    image: postgres:15-alpine
    container_name: buildup_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digitalport123}
      POSTGRES_DB: buildup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildup"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: buildup_backend_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-digitalport123}@postgres:5432/buildup?schema=public
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: buildup_frontend_prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
