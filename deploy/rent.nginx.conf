server {
    listen 80;
    server_name rent.buildup.ge;
    location /.well-known/acme-challenge/ {
        root /var/www/buildup-rent-acme;
    }
    location / {
        return 301 https://rent.buildup.ge$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rent.buildup.ge;
    ssl_certificate /etc/letsencrypt/live/rent.buildup.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rent.buildup.ge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
